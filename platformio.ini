[env:robot-eyes]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
monitor_speed = 115200
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
lib_deps =
  https://github.com/m5stack/M5GFX.git#347a23274081a105cb9fc0fc3bbf0e15c78e79c3
  https://github.com/m5stack/M5Unified.git#e125e73f28b6b83e621e48df432af426bb2ff935
  https://github.com/m5stack/M5Chain.git#d021bae2e9145be94f355c53f8a84e1bd7fcce4d
